<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Super Clipboard">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9bf2"/>
      <stop offset="1" stop-color="#4a7de0"/>
    </linearGradient>
  </defs>
  <!-- 앱 타일 -->
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- 뒤 카드 (여러 항목 = super) -->
  <rect x="25" y="15" width="23" height="29" rx="4" fill="#ffffff" opacity="0.42"/>
  <!-- 클립보드 판 -->
  <rect x="16" y="18" width="26" height="32" rx="4.5" fill="#ffffff"/>
  <!-- 집게 -->
  <rect x="24" y="14.5" width="10" height="7" rx="2.5" fill="#e7effc"/>
  <rect x="26.3" y="11.5" width="5.4" height="6" rx="2.7" fill="#dbe6fb"/>
  <!-- 텍스트 줄 -->
  <rect x="20" y="28" width="18" height="3" rx="1.5" fill="#9db8ef"/>
  <rect x="20" y="35" width="18" height="3" rx="1.5" fill="#c6d6f6"/>
  <rect x="20" y="42" width="11" height="3" rx="1.5" fill="#c6d6f6"/>
</svg>
